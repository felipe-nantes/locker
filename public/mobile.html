<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Nexlock — Acesso ao Hub</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🔒</text></svg>" />
</head>
<body class="mobile-body">
  <div class="mobile-card">
    <div class="card">

      <!-- Cabeçalho do hub -->
      <div class="mobile-hero">
        <div class="shield">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M13 8l-3 4h4l-3 4"/>
          </svg>
        </div>
        <div class="hub-id" id="hub-title">Hub …</div>
        <div class="sub" id="hub-sub">Carregador Protegido</div>
        <div class="loc" id="hub-loc"></div>
      </div>

      <!-- Formulário de credenciais -->
      <form id="form" novalidate>
        <div class="field">
          <label for="f-name">Nome completo</label>
          <input type="text" id="f-name" name="name" placeholder="Seu nome" autocomplete="name" />
          <div class="err" id="e-name"></div>
        </div>

        <div class="field">
          <label for="f-phone">Telefone</label>
          <input type="tel" id="f-phone" name="phone" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="tel" />
          <div class="err" id="e-phone"></div>
        </div>

        <div class="field">
          <label for="f-plate">Placa do veículo</label>
          <input type="text" id="f-plate" name="plate" placeholder="ABC-1D23" autocapitalize="characters" style="text-transform:uppercase" />
          <div class="err" id="e-plate"></div>
        </div>

        <div class="field">
          <label for="f-email">E-mail <span class="opt">(opcional)</span></label>
          <input type="email" id="f-email" name="email" placeholder="voce@email.com" autocomplete="email" inputmode="email" />
          <div class="err" id="e-email"></div>
        </div>

        <label class="terms">
          <input type="checkbox" id="f-terms" />
          <span>Li e aceito os <a href="#" onclick="return false">termos de uso</a> e autorizo o registro dos meus
          dados para fins de controle de acesso e segurança do equipamento.</span>
        </label>
        <div class="err" id="e-terms" style="padding:4px 0 0 28px"></div>

        <div class="form-error" id="form-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4M12 17h.01"/></svg>
          <span id="form-error-text">Preencha todos os campos obrigatórios.</span>
        </div>

        <div style="margin-top:20px">
          <button type="submit" id="btn-submit" class="btn primary block">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
            Solicitar acesso
          </button>
        </div>
      </form>

      <!-- Tela de sucesso -->
      <div class="success" id="success">
        <div class="check">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2>Acesso autorizado</h2>
        <p>A fechadura foi liberada. Você já pode abrir o hub.</p>
        <div class="summary" id="success-summary"></div>
        <div style="margin-top:18px">
          <button class="btn ghost block" id="btn-again">Fazer nova solicitação</button>
        </div>
      </div>

    </div>

    <p class="mobile-foot">
      <span class="badge-secure">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Nexlock — sessão de acesso registrada com data, hora e identificação.
      </span>
    </p>
  </div>

  <script src="/mobile.js"></script>
</body>
</html>
